name: vcrlt_android_controller
description: "VCRLT Game Pad Android Controller APK featuring the dani.x240 console layout"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  vibration: ^2.0.0
  flutter_services_binding: ^0.1.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
