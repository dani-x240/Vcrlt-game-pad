name: Build VCRLT Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (dani.x240 Controller)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Scaffold Android platform scaffolding
        working-directory: ./flutter_source/android_controller
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.vcrlt.gamepad --project-name vcrlt_android_controller
          fi

          # Ensure AndroidManifest has CAMERA, INTERNET, WIFI permissions
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"\/>\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false"\/>\n    <application/' "$MANIFEST" 2>/dev/null || true
          fi

          # Ensure minSdk is at least 21 for mobile_scanner (Camera2 API), compileSdk is 35, and ndkVersion is 27.0.12077973
          LOCAL_PROP="android/local.properties"
          touch "$LOCAL_PROP"
          echo "flutter.minSdkVersion=21" >> "$LOCAL_PROP"
          echo "flutter.compileSdkVersion=35" >> "$LOCAL_PROP"
          echo "flutter.targetSdkVersion=35" >> "$LOCAL_PROP"
          echo "flutter.ndkVersion=27.0.12077973" >> "$LOCAL_PROP"

          GRADLE_KTS="android/app/build.gradle.kts"
          if [ -f "$GRADLE_KTS" ]; then
            sed -i 's/android {/android {\n    ndkVersion = "27.0.12077973"/' "$GRADLE_KTS" 2>/dev/null || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' "$GRADLE_KTS" 2>/dev/null || true
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' "$GRADLE_KTS" 2>/dev/null || true
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' "$GRADLE_KTS" 2>/dev/null || true
          fi
          GRADLE="android/app/build.gradle"
          if [ -f "$GRADLE" ]; then
            sed -i 's/android {/android {\n    ndkVersion "27.0.12077973"/' "$GRADLE" 2>/dev/null || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' "$GRADLE" 2>/dev/null || true
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' "$GRADLE" 2>/dev/null || true
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/' "$GRADLE" 2>/dev/null || true
          fi

          # Embed custom gamepad icon if available
          if [ -f "assets/icon.png" ]; then
            mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
            cp assets/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png 2>/dev/null || true
            cp assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || true
            cp assets/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png 2>/dev/null || true
            cp assets/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null || true
            cp assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || true
          fi

      - name: Get Dependencies
        working-directory: ./flutter_source/android_controller
        run: flutter pub get

      - name: Build Single Universal Android APK
        working-directory: ./flutter_source/android_controller
        run: |
          # Build a single Universal APK that installs on any Android device (32-bit and 64-bit)
          flutter build apk --release --no-tree-shake-icons || flutter build apk --debug --no-tree-shake-icons

          mkdir -p ../../release_apks
          APK_DIR="build/app/outputs/flutter-apk"

          if [ -f "$APK_DIR/app-release.apk" ]; then
            cp "$APK_DIR/app-release.apk" ../../release_apks/VCRLT-Gamepad-Controller.apk
          elif [ -f "$APK_DIR/app-debug.apk" ]; then
            cp "$APK_DIR/app-debug.apk" ../../release_apks/VCRLT-Gamepad-Controller.apk
          else
            FOUND_APK=$(find build/app/outputs -name "*.apk" | head -n 1)
            cp "$FOUND_APK" ../../release_apks/VCRLT-Gamepad-Controller.apk
          fi

      - name: Upload Single Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCRLT-Gamepad-Controller-APK
          path: release_apks/VCRLT-Gamepad-Controller.apk
