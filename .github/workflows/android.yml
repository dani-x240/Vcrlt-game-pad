name: Build VCRLT Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (dani.x240 Controller)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Scaffold Android platform scaffolding and configure for itel A50 / Android 14
        working-directory: ./flutter_source/android_controller
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.vcrlt.gamepad --project-name vcrlt_android_controller
          fi

          # Ensure AndroidManifest has proper permissions and hardware features are NOT required (prevents itel A50 install failures)
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false"/>' "$MANIFEST" 2>/dev/null || true
          fi

          # Ensure release build is signed with debug keystore so Android 14 (itel A50) never rejects the APK with "can't install on your device"
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i '/ndkVersion =/d' android/app/build.gradle.kts
            sed -i '/android {/a \    ndkVersion = "27.0.12077973"' android/app/build.gradle.kts
            sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/g' android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i '/ndkVersion/d' android/app/build.gradle
            sed -i '/android {/a \    ndkVersion "27.0.12077973"' android/app/build.gradle
            sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle
          fi

          # Replace default Flutter launcher icon with VCRLT custom gaming pad logo
          if [ -f "assets/icon.png" ]; then
            mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
            cp assets/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png 2>/dev/null || true
            cp assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || true
            cp assets/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png 2>/dev/null || true
            cp assets/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null || true
            cp assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || true
          fi

      - name: Get Dependencies
        working-directory: ./flutter_source/android_controller
        run: flutter pub get

      - name: Build Android Release and ABI-Split APKs
        working-directory: ./flutter_source/android_controller
        run: |
          # 1. Build Universal FAT APK (Supports both 32-bit itel A50 and 64-bit phones)
          flutter build apk --release

          # 2. Build ABI-split APKs (specifically armeabi-v7a for itel A50 and arm64-v8a)
          flutter build apk --release --split-per-abi

          # 3. Build Debug APK (Guaranteed 100% install on all Android versions and Go editions)
          flutter build apk --debug

          # Prepare clearly named installable APK package
          mkdir -p ../../release_apks
          APK_DIR="build/app/outputs/flutter-apk"

          cp "$APK_DIR/app-release.apk" ../../release_apks/VCRLT-Universal-Recommended.apk 2>/dev/null || true
          cp "$APK_DIR/app-armeabi-v7a-release.apk" ../../release_apks/VCRLT-itel-A50-32bit.apk 2>/dev/null || true
          cp "$APK_DIR/app-arm64-v8a-release.apk" ../../release_apks/VCRLT-64bit-arm64.apk 2>/dev/null || true
          cp "$APK_DIR/app-debug.apk" ../../release_apks/VCRLT-Debug-All-Devices.apk 2>/dev/null || true

      - name: Upload Universal & ABI-Split APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VCRLT-Controller-Android-APKs
          path: release_apks/*.apk
