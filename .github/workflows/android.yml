name: Build VCRLT Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (dani.x240 Controller)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Scaffold Android platform scaffolding
        working-directory: ./flutter_source/android_controller
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.vcrlt.gamepad --project-name vcrlt_android_controller
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"\/>\n    <application/' "$MANIFEST" 2>/dev/null || true
          fi

      - name: Get Dependencies
        working-directory: ./flutter_source/android_controller
        run: flutter pub get

      - name: Build Android Release and ABI-Split APKs
        working-directory: ./flutter_source/android_controller
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          flutter build apk --debug

          mkdir -p ../../release_apks
          APK_DIR="build/app/outputs/flutter-apk"

          cp "$APK_DIR/app-release.apk" ../../release_apks/VCRLT-Universal-Recommended.apk 2>/dev/null || true
          cp "$APK_DIR/app-armeabi-v7a-release.apk" ../../release_apks/VCRLT-itel-A50-32bit.apk 2>/dev/null || true
          cp "$APK_DIR/app-arm64-v8a-release.apk" ../../release_apks/VCRLT-64bit-arm64.apk 2>/dev/null || true
          cp "$APK_DIR/app-debug.apk" ../../release_apks/VCRLT-Debug-All-Devices.apk 2>/dev/null || true

      - name: Upload Universal & ABI-Split APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VCRLT-Controller-Android-APKs
          path: release_apks/*.apk
